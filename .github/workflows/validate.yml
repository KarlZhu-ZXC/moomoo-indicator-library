name: Validate indicators

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fidelity-test dependencies
        run: python -m pip install -r tools/reference/v4_1/requirements.txt
      - name: Compile Python syntax
        run: python -m compileall -q indicators
      - name: Check moomoo plot constraints
        run: python tools/validate.py
      - name: Simulate moomoo Sequence runtime
        run: python tools/reference/v4_1/validate_stub_runtime.py
      - name: Validate optimized algorithms
        run: python tools/reference/v4_1/validate_optimized_algorithms.py
      - name: Validate LuxAlgo reference state
        run: python tools/reference/v4_1/validate_smc_reference.py
      - name: Validate ChartPrime reference state
        run: python tools/reference/v4_1/validate_ote_reference.py
      - name: Validate v4.1 fidelity fixes
        run: python tools/reference/v4_1/validate_v4_1_fidelity.py
