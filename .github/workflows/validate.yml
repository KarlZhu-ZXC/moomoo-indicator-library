name: Validate indicators

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python syntax
        run: python -m compileall -q indicators
      - name: Check moomoo plot constraints
        run: python tools/validate.py
